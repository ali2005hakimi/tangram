<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آزمایشگاه تبدیلات هندسی تنگرام</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- فونت مطمئن وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif !important;
        }
        
        body { 
            background: radial-gradient(circle at 50% 0%, #f8fafc, #e2e8f0);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; 
            overscroll-behavior: none;
        }
        
        .polygon { 
            transition: stroke-width 0.15s ease; 
            cursor: grab; 
            -webkit-tap-highlight-color: transparent;
        }
        .polygon:active { cursor: grabbing; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f8fafc; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        canvas, svg { touch-action: none; outline: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CELL_SIZE = 45; 

        // آیکون‌های SVG توکار
        const Icons = {
            Shapes: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4.5l7.5 13H4.5L12 6.5z"/></svg>,
            Reset: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>,
            Undo: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>,
            Redo: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>,
            Grid: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>,
            Center: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>,
            List: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>,
            Reflect: () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 12h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2H7zm-4 0h2v2H3zm16-4h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2H7zm-4 0h2v2H3zm16 8h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2h-2zm-4 0h2v2H7zm-4 0h2v2H3zM12 2v20c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1z"/></svg>,
            Heart: () => <svg className="w-3.5 h-3.5 inline-block text-rose-500 fill-current animate-pulse mx-1" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>,
            Check: () => <svg className="w-6 h-6 fill-current text-white" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>,
            Close: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        };

        const INITIAL_PIECES = [
            { id: 'lt1', name: 'مثلث بزرگ آبی', color: '#3b82f6', vertices: [{x:-14,y:9}, {x:-6,y:9}, {x:-10,y:5}] },
            { id: 'lt2', name: 'مثلث بزرگ قرمز', color: '#ef4444', vertices: [{x:6,y:9}, {x:6,y:1}, {x:10,y:5}] },
            { id: 'mt', name: 'مثلث متوسط سبز', color: '#10b981', vertices: [{x:-6,y:-1}, {x:-6,y:-5}, {x:-10,y:-5}] },
            { id: 'sq', name: 'مربع نارنجی', color: '#f97316', vertices: [{x:10,y:-5}, {x:12,y:-3}, {x:14,y:-5}, {x:12,y:-7}] },
            { id: 'st1', name: 'مثلث کوچک زرد', color: '#eab308', vertices: [{x:-14,y:0}, {x:-12,y:2}, {x:-14,y:4}] },
            { id: 'st2', name: 'مثلث کوچک فیروزه‌ای', color: '#06b6d4', vertices: [{x:14,y:4}, {x:14,y:0}, {x:12,y:2}] },
            { id: 'para', name: 'متوازی‌الاضلاع بنفش', color: '#8b5cf6', vertices: [{x:-2,y:-9}, {x:2,y:-9}, {x:4,y:-7}, {x:0,y:-7}] }
        ];

        const cloneVertices = (verts) => verts.map(v => ({ x: v.x, y: v.y }));
        const clonePieces = (pcs) => pcs.map(p => ({ ...p, vertices: cloneVertices(p.vertices) }));

        const getCenter = (pts) => {
            let minX = Math.min(...pts.map(p=>p.x)), maxX = Math.max(...pts.map(p=>p.x));
            let minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
            return { x: (minX+maxX)/2, y: (minY+maxY)/2, minX, maxX, minY, maxY };
        };

        const pointInPolygon = (pt, vs) => {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
                let intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        };

        const App = () => {
            const [pieces, setPieces] = useState(() => clonePieces(INITIAL_PIECES));
            const [selectedId, setSelectedId] = useState(null);
            const [history, setHistory] = useState([]);
            const [redoStack, setRedoStack] = useState([]);
            const [isWon, setIsWon] = useState(false);
            const [showGrid, setShowGrid] = useState(true);
            const [showReport, setShowReport] = useState(false);
            const [showMobileHistory, setShowMobileHistory] = useState(false);
            const [isAnimating, setIsAnimating] = useState(false);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            
            const svgRef = useRef(null);
            const containerRef = useRef(null);
            const [containerSize, setContainerSize] = useState({ w: 800, h: 600 });
            
            // تابع محاسبه دید استاندارد و کامپکت متناسب با کادر
            const getDefaultCam = (w = containerSize.w, h = containerSize.h) => {
                const effectiveWidth = w > 0 ? w : (window.innerWidth < 768 ? window.innerWidth : window.innerWidth - 340);
                const effectiveHeight = h > 0 ? h : window.innerHeight - 80;
                
                // قطعات از -15 تا +15 در محور افقی و از -10 تا +10 در محور عمودی گسترده‌اند
                const spanX = 33 * CELL_SIZE; 
                const spanY = 23 * CELL_SIZE; 
                
                const fitZoomX = effectiveWidth / spanX;
                const fitZoomY = effectiveHeight / spanY;
                
                let optimalZoom = Math.min(fitZoomX, fitZoomY);
                // محدودسازی در یک بازه دید متعادل و استاندارد
                optimalZoom = Math.min(Math.max(optimalZoom, 0.52), 0.88);

                return { x: 0, y: 0, zoom: optimalZoom };
            };

            const [cam, setCam] = useState(() => getDefaultCam(window.innerWidth, window.innerHeight));
            const touchesRef = useRef({});

            useEffect(() => {
                const resize = () => {
                    const mobile = window.innerWidth < 768;
                    setIsMobile(mobile);
                    if (containerRef.current) {
                        const w = containerRef.current.clientWidth;
                        const h = containerRef.current.clientHeight;
                        setContainerSize({ w, h });
                    }
                };
                window.addEventListener('resize', resize);
                resize();
                return () => window.removeEventListener('resize', resize);
            }, []);

            // تنظیم اولیه دید به محض آماده شدن ابعاد المان کانتینر
            useEffect(() => {
                if (containerRef.current) {
                    const w = containerRef.current.clientWidth;
                    const h = containerRef.current.clientHeight;
                    if (w > 0 && h > 0) {
                        setCam(getDefaultCam(w, h));
                    }
                }
            }, [containerSize.w, containerSize.h]);

            const resetCameraToCenter = () => {
                setCam(getDefaultCam(containerSize.w, containerSize.h));
            };

            // مدیریت نرم چرخ ماوس
            useEffect(() => {
                const svg = svgRef.current;
                if (!svg) return;
                const handleWheel = (e) => {
                    e.preventDefault();
                    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.12;
                    applyZoom(zoomFactor, e.clientX, e.clientY);
                };
                svg.addEventListener('wheel', handleWheel, { passive: false });
                return () => svg.removeEventListener('wheel', handleWheel);
            }, [cam, containerSize]);

            const applyZoom = (factor, clientX = null, clientY = null) => {
                const newZoom = Math.min(Math.max(0.35, cam.zoom * factor), 2.5);
                if (clientX === null || clientY === null) {
                    setCam(c => ({ ...c, zoom: newZoom }));
                    return;
                }
                const rect = containerRef.current.getBoundingClientRect();
                const mouseX = clientX - rect.left;
                const mouseY = clientY - rect.top;
                
                const camX = mouseX - (mouseX - containerSize.w/2 - cam.x) * (newZoom / cam.zoom) - containerSize.w/2;
                const camY = mouseY - (mouseY - containerSize.h/2 - cam.y) * (newZoom / cam.zoom) - containerSize.h/2;
                setCam({ x: camX, y: camY, zoom: newZoom });
            };

            const getMathCoords = (screenX, screenY) => {
                const mathX = (screenX - (containerSize.w/2 + cam.x)) / (CELL_SIZE * cam.zoom);
                const mathY = -(screenY - (containerSize.h/2 + cam.y)) / (CELL_SIZE * cam.zoom);
                return { x: mathX, y: mathY };
            };

            const getScreenCoords = (mathX, mathY) => {
                return {
                    x: containerSize.w/2 + cam.x + (mathX * CELL_SIZE * cam.zoom),
                    y: containerSize.h/2 + cam.y - (mathY * CELL_SIZE * cam.zoom)
                };
            };

            const checkWinGeometric = (currentPieces) => {
                for(let p of currentPieces) {
                    for(let v of p.vertices) {
                        if(v.x < -4.01 || v.x > 4.01 || v.y < -4.01 || v.y > 4.01) return false;
                    }
                }
                const eps1 = 0.1137, eps2 = 0.1472; 
                for(let i=0; i<32; i++){
                    for(let j=0; j<32; j++){
                        let pt = { x: -4 + eps1 + i * 0.25, y: -4 + eps2 + j * 0.25 };
                        let insideCount = 0;
                        for(let p of currentPieces) {
                            if(pointInPolygon(pt, p.vertices)) insideCount++;
                        }
                        if(insideCount !== 1) return false; 
                    }
                }
                setIsWon(true);
                return true;
            };

            const pushHistory = (pieceId, desc, newPieces, previousPieces = null) => {
                const sourcePieces = previousPieces || pieces;
                const targetPrev = cloneVertices(sourcePieces.find(x => x.id === pieceId).vertices);
                const targetNext = cloneVertices(newPieces.find(x => x.id === pieceId).vertices);

                setHistory(prevHist => [
                    ...prevHist, 
                    { 
                        pieceId, 
                        name: getPieceName(pieceId), 
                        desc, 
                        prev: targetPrev, 
                        next: targetNext 
                    }
                ]);
                setRedoStack([]);
                setPieces(clonePieces(newPieces));
                checkWinGeometric(newPieces);
            };

            const [dragInfo, setDragInfo] = useState(null);
            const [panInfo, setPanInfo] = useState(null);

            const onPointerDownCanvas = (e) => {
                if(isAnimating) return;
                touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                
                const touchKeys = Object.keys(touchesRef.current);
                if (touchKeys.length === 2) {
                    const t1 = touchesRef.current[touchKeys[0]];
                    const t2 = touchesRef.current[touchKeys[1]];
                    touchesRef.current.initialDist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
                    touchesRef.current.initialZoom = cam.zoom;
                    return;
                }

                if(e.target.tagName !== 'svg') return;
                setPanInfo({ startX: e.clientX, startY: e.clientY, camX: cam.x, camY: cam.y });
                setSelectedId(null);
            };

            const onPointerDownPiece = (e, id) => {
                if (isAnimating) return;
                e.stopPropagation();
                touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                setSelectedId(id);
                const pt = getMathCoords(e.clientX, e.clientY);
                const currentPiece = pieces.find(p=>p.id===id);
                setDragInfo({ 
                    id, 
                    startPt: pt, 
                    startVerts: cloneVertices(currentPiece.vertices),
                    originalPieces: clonePieces(pieces)
                });
            };

            const onPointerMove = (e) => {
                if (isAnimating) return;
                if (touchesRef.current[e.pointerId]) {
                    touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                }

                const touchKeys = Object.keys(touchesRef.current).filter(k => k !== 'initialDist' && k !== 'initialZoom');
                if (touchKeys.length === 2 && touchesRef.current.initialDist) {
                    const t1 = touchesRef.current[touchKeys[0]];
                    const t2 = touchesRef.current[touchKeys[1]];
                    const dist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
                    const zoomFactor = dist / touchesRef.current.initialDist;
                    const targetZoom = Math.min(Math.max(0.35, touchesRef.current.initialZoom * zoomFactor), 2.5);
                    setCam(c => ({ ...c, zoom: targetZoom }));
                    return;
                }

                if (panInfo) {
                    setCam({ ...cam, x: panInfo.camX + (e.clientX - panInfo.startX), y: panInfo.camY + (e.clientY - panInfo.startY) });
                } else if (dragInfo) {
                    const pt = getMathCoords(e.clientX, e.clientY);
                    let dx = Math.round(pt.x - dragInfo.startPt.x);
                    let dy = Math.round(pt.y - dragInfo.startPt.y);
                    
                    setPieces(prev => prev.map(p => p.id === dragInfo.id ? { 
                        ...p, 
                        vertices: dragInfo.startVerts.map(v => ({ x: v.x + dx, y: v.y + dy })) 
                    } : p));
                }
            };

            const onPointerUp = (e) => {
                if (e && e.pointerId) {
                    delete touchesRef.current[e.pointerId];
                    if (Object.keys(touchesRef.current).length < 2) {
                        delete touchesRef.current.initialDist;
                        delete touchesRef.current.initialZoom;
                    }
                }
                if (panInfo) setPanInfo(null);
                if (dragInfo) {
                    const p = pieces.find(x => x.id === dragInfo.id);
                    const dx = p.vertices[0].x - dragInfo.startVerts[0].x;
                    const dy = p.vertices[0].y - dragInfo.startVerts[0].y;
                    if (Math.abs(dx)>0.1 || Math.abs(dy)>0.1) {
                        const dirX = dx>0 ? 'راست' : dx<0 ? 'چپ' : '';
                        const dirY = dy>0 ? 'بالا' : dy<0 ? 'پایین' : '';
                        const parts = [];
                        if(dx!==0) parts.push(`${Math.abs(Math.round(dx))} خانه به ${dirX}`);
                        if(dy!==0) parts.push(`${Math.abs(Math.round(dy))} خانه به ${dirY}`);
                        pushHistory(dragInfo.id, `انتقال ${parts.join(' و ')}`, pieces, dragInfo.originalPieces);
                    }
                    setDragInfo(null);
                }
            };

            const executeDirectRotate = (id, angle) => {
                if (isAnimating) return;
                setIsAnimating(true);
                
                const originalPieces = clonePieces(pieces);
                const p = pieces.find(x => x.id === id);
                const c = getCenter(p.vertices);
                const startVerts = cloneVertices(p.vertices);
                const duration = 300;
                const start = performance.now();

                const frame = (now) => {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const currentAngle = angle * ease;
                    
                    const rad = (-currentAngle) * Math.PI / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);

                    const currentVerts = startVerts.map(pt => ({
                        x: c.x + (pt.x - c.x)*cos - (pt.y - c.y)*sin,
                        y: c.y + (pt.x - c.x)*sin + (pt.y - c.y)*cos
                    }));

                    setPieces(prev => prev.map(x => x.id === id ? { ...x, vertices: currentVerts } : x));

                    if (progress < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        const finalRad = (-angle) * Math.PI / 180;
                        const finalCos = Math.round(Math.cos(finalRad));
                        const finalSin = Math.round(Math.sin(finalRad));
                        
                        const finalVerts = startVerts.map(pt => ({
                            x: c.x + (pt.x - c.x)*finalCos - (pt.y - c.y)*finalSin,
                            y: c.y + (pt.x - c.x)*finalSin + (pt.y - c.y)*finalCos
                        }));
                        
                        const newPieces = pieces.map(x => x.id === id ? { ...x, vertices: finalVerts } : x);
                        pushHistory(id, `دوران ${angle} درجه`, newPieces, originalPieces);
                        setIsAnimating(false);
                    }
                };
                requestAnimationFrame(frame);
            };

            const executeDirectReflect = (id) => {
                if (isAnimating) return;
                setIsAnimating(true);

                const originalPieces = clonePieces(pieces);
                const p = pieces.find(x => x.id === id);
                const c = getCenter(p.vertices);
                const startVerts = cloneVertices(p.vertices);
                const targetVerts = p.vertices.map(v => ({ x: 2*c.x - v.x, y: v.y }));
                
                const duration = 280;
                const start = performance.now();

                const frame = (now) => {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    const currentVerts = startVerts.map((v, i) => ({
                        x: v.x + (targetVerts[i].x - v.x) * ease,
                        y: v.y + (targetVerts[i].y - v.y) * ease
                    }));

                    setPieces(prev => prev.map(x => x.id === id ? { ...x, vertices: currentVerts } : x));

                    if (progress < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        const newPieces = pieces.map(x => x.id === id ? { ...x, vertices: targetVerts } : x);
                        pushHistory(id, `قرینه نسبت به خط عمودی`, newPieces, originalPieces);
                        setIsAnimating(false);
                    }
                };
                requestAnimationFrame(frame);
            };

            const handleUndo = () => {
                if (!history.length || isAnimating) return;
                const last = history[history.length - 1];
                
                setPieces(prev => prev.map(p => 
                    p.id === last.pieceId ? { ...p, vertices: cloneVertices(last.prev) } : p
                ));
                setRedoStack([last, ...redoStack]);
                setHistory(history.slice(0, -1));
                setIsWon(false);
            };

            const handleRedo = () => {
                if (!redoStack.length || isAnimating) return;
                const next = redoStack[0];
                
                const newPieces = pieces.map(p => 
                    p.id === next.pieceId ? { ...p, vertices: cloneVertices(next.next) } : p
                );
                setPieces(newPieces);
                setHistory([...history, next]);
                setRedoStack(redoStack.slice(1));
                checkWinGeometric(newPieces);
            };

            const handleReset = () => {
                if (isAnimating) return;
                if(confirm('آیا مطمئن هستید که می‌خواهید همه چیز را از اول شروع کنید؟')) {
                    setPieces(clonePieces(INITIAL_PIECES));
                    setHistory([]);
                    setRedoStack([]);
                    setSelectedId(null);
                    resetCameraToCenter();
                    setIsWon(false);
                }
            };

            const getPieceName = (id) => INITIAL_PIECES.find(p=>p.id===id)?.name || id;
            const getPieceColor = (id) => INITIAL_PIECES.find(p=>p.id===id)?.color || '#94a3b8';

            const renderGrid = () => {
                if(!showGrid) return null;
                const lines = [];
                for(let i=-30; i<=30; i++) {
                    const isAxis = i === 0;
                    const stroke = isAxis ? "#94a3b8" : "#cbd5e1";
                    const w = isAxis ? 2.5 : 1;
                    lines.push(<line key={`v${i}`} x1={i} y1={-30} x2={i} y2={30} stroke={stroke} strokeWidth={w/CELL_SIZE} opacity={isAxis ? 0.7 : 0.4} />);
                    lines.push(<line key={`h${i}`} x1={-30} y1={i} x2={30} y2={i} stroke={stroke} strokeWidth={w/CELL_SIZE} opacity={isAxis ? 0.7 : 0.4} />);
                }
                return <g>{lines}</g>;
            };

            const selectedPiece = pieces.find(x => x.id === selectedId);

            const getMenuPosition = () => {
                if (!selectedPiece) return { left: 0, top: 0 };
                const c = getCenter(selectedPiece.vertices);
                const sc = getScreenCoords(c.maxX + 0.6, c.y);
                
                const menuWidth = 180;
                const menuHeight = 150;
                
                let posX = sc.x;
                let posY = sc.y - menuHeight / 2;

                if (posX + menuWidth > containerSize.w - 15) {
                    const leftSc = getScreenCoords(c.minX - 0.6, c.y);
                    posX = leftSc.x - menuWidth;
                }
                if (posX < 15) posX = 15;

                if (posY < 15) posY = 15;
                if (posY + menuHeight > containerSize.h - 15) {
                    posY = containerSize.h - menuHeight - 15;
                }

                return { left: `${posX}px`, top: `${posY}px` };
            };

            return (
                <div className="h-full flex flex-col select-none overflow-hidden">
                    {/* هدر */}
                    <header className="h-14 md:h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-3 md:px-6 z-20 shrink-0 shadow-sm">
                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-2 md:p-2.5 rounded-xl shadow-md flex items-center justify-center">
                                <Icons.Shapes />
                            </div>
                            <h1 className="text-sm md:text-xl font-black text-slate-800 tracking-tight">آزمایشگاه هندسه: ساخت مربع</h1>
                        </div>
                        <div className="flex items-center gap-1.5 md:gap-3">
                            <button onClick={resetCameraToCenter} className="text-slate-600 hover:text-blue-600 text-xs md:text-sm flex items-center gap-1.5 border border-slate-200 px-2.5 py-1.5 rounded-lg hover:bg-white transition bg-slate-50 font-bold" title="تنظیم زاویه دید به مرکز و نمایش تمام قطعات">
                                <Icons.Center /> <span className="hidden sm:inline">مرکز</span>
                            </button>
                            <button onClick={()=>setShowGrid(!showGrid)} className={`w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-lg border border-slate-200 hover:bg-slate-100 transition ${showGrid ? 'text-blue-600 bg-blue-50/50' : 'text-slate-500'}`} title="نمایش شبکه">
                                <Icons.Grid />
                            </button>
                            <button onClick={handleReset} className="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-lg text-slate-500 hover:text-red-600 hover:bg-red-50 border border-slate-200 transition" title="شروع دوباره">
                                <Icons.Reset />
                            </button>

                            {/* دکمه موبایل گزارش کار */}
                            <button onClick={()=>setShowMobileHistory(true)} className="md:hidden flex items-center gap-1.5 bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg font-bold text-xs border border-blue-200">
                                <Icons.List /> مراحل
                                {history.length > 0 && <span className="bg-blue-600 text-white text-[10px] px-1.5 rounded-full font-black">{history.length}</span>}
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-hidden relative">
                        
                        {/* محیط کاری بوم */}
                        <div ref={containerRef} className="flex-1 relative overflow-hidden cursor-move">
                            <svg ref={svgRef} 
                                 width="100%" height="100%" 
                                 onPointerDown={onPointerDownCanvas}
                                 onPointerMove={onPointerMove} 
                                 onPointerUp={onPointerUp} 
                                 onPointerLeave={onPointerUp}
                                 className="absolute inset-0 block">
                                
                                <g transform={`translate(${containerSize.w/2 + cam.x}, ${containerSize.h/2 + cam.y}) scale(${cam.zoom}, ${cam.zoom})`}>
                                    <g transform={`scale(${CELL_SIZE}, ${-CELL_SIZE})`}>
                                        
                                        {renderGrid()}

                                        {/* مربع هدف */}
                                        <rect x="-4" y="-4" width="8" height="8" fill="rgba(59, 130, 246, 0.04)" stroke="#64748b" strokeWidth={3/CELL_SIZE} strokeDasharray={`${8/CELL_SIZE} ${6/CELL_SIZE}`} pointerEvents="none" rx={2/CELL_SIZE}/>
                                        <g transform="scale(1, -1)" pointerEvents="none">
                                            <text x="0" y="0" textAnchor="middle" dominantBaseline="middle" fill="#94a3b8" fontSize={24/CELL_SIZE} className="font-black pointer-events-none opacity-50">مربع هدف</text>
                                        </g>

                                        {/* قطعات تنگرام */}
                                        {pieces.map(p => (
                                            <polygon
                                                key={p.id}
                                                points={p.vertices.map(v => `${v.x},${v.y}`).join(' ')}
                                                fill={p.color}
                                                stroke="rgba(0,0,0,0.18)"
                                                strokeWidth={(selectedId === p.id ? 3.5 : 1.5)/CELL_SIZE}
                                                strokeLinejoin="round"
                                                className="polygon"
                                                onPointerDown={(e) => onPointerDownPiece(e, p.id)}
                                                style={{ filter: selectedId === p.id ? 'drop-shadow(0px 8px 14px rgba(0,0,0,0.45))' : 'drop-shadow(0px 3px 6px rgba(0,0,0,0.22))' }}
                                            />
                                        ))}
                                    </g>
                                </g>
                            </svg>

                            {/* کنترلر زوم با دکمه ۱۰۰٪ هماهنگ با مرکز دید */}
                            <div className="absolute right-4 bottom-5 flex flex-col gap-2 z-20">
                                <button onClick={()=>applyZoom(1.2)} className="w-10 h-10 md:w-11 md:h-11 bg-white hover:bg-slate-50 text-slate-800 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-black text-2xl transition active:scale-95 leading-none" title="بزرگنمایی">
                                    +
                                </button>
                                <button onClick={()=>applyZoom(0.83)} className="w-10 h-10 md:w-11 md:h-11 bg-white hover:bg-slate-50 text-slate-800 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-black text-2xl transition active:scale-95 leading-none pb-1" title="کوچک‌نمایی">
                                    &minus;
                                </button>
                                <button onClick={resetCameraToCenter} className="w-10 h-10 md:w-11 md:h-11 bg-white hover:bg-slate-50 text-blue-600 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-bold text-xs transition active:scale-95" title="بازنشانی زوم و نمایش کامل قطعات">
                                    100%
                                </button>
                            </div>

                            {/* منوی چرخش و تقارن شکل */}
                            {selectedPiece && !dragInfo && !isAnimating && (
                                isMobile ? (
                                    <div className="absolute bottom-4 left-4 right-16 glass-panel p-2.5 rounded-2xl border border-white shadow-2xl flex flex-col gap-2 z-30">
                                        <div className="flex justify-between items-center px-1">
                                            <span className="text-xs font-black text-slate-700">{selectedPiece.name}</span>
                                            <span className="text-[10px] text-slate-400">بکشید تا جابجا شود</span>
                                        </div>
                                        <div className="flex gap-1.5">
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 90)} className="flex-1 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg font-black text-xs">90°</button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 180)} className="flex-1 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg font-black text-xs">180°</button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 270)} className="flex-1 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg font-black text-xs">270°</button>
                                            <button onClick={()=>executeDirectReflect(selectedPiece.id)} className="flex-1 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg font-black text-xs flex items-center justify-center gap-1">
                                                <Icons.Reflect /> قرینه
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="absolute glass-panel shadow-2xl border border-white/90 rounded-2xl flex flex-col overflow-hidden z-30 w-44" 
                                         style={getMenuPosition()}>
                                        <div className="bg-slate-100/90 text-[11px] font-black px-3 py-2 border-b border-slate-200 text-center text-slate-700">
                                            {selectedPiece.name}
                                        </div>
                                        
                                        <div className="flex border-b border-slate-200 bg-white/60">
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 90)} className="flex-1 py-2.5 hover:bg-blue-50 text-blue-700 font-bold transition text-xs border-l border-slate-200" title="دوران ۹۰ درجه">
                                                90°
                                            </button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 180)} className="flex-1 py-2.5 hover:bg-blue-50 text-blue-700 font-bold transition text-xs border-l border-slate-200" title="دوران ۱۸۰ درجه">
                                                180°
                                            </button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 270)} className="flex-1 py-2.5 hover:bg-blue-50 text-blue-700 font-bold transition text-xs" title="دوران ۲۷۰ درجه">
                                                270°
                                            </button>
                                        </div>

                                        <button onClick={()=>executeDirectReflect(selectedPiece.id)} className="w-full py-2.5 text-xs hover:bg-indigo-50 text-indigo-700 bg-white/60 font-bold flex items-center justify-center gap-2 transition">
                                            <Icons.Reflect /> قرینه عمودی
                                        </button>
                                        
                                        <div className="py-1.5 text-[10px] text-slate-400 bg-slate-50 border-t border-slate-200 text-center font-medium">
                                            برای انتقال، قطعه را بکشید
                                        </div>
                                    </div>
                                )
                            )}
                        </div>

                        {/* سایدبار ثابت لپ‌تاپ */}
                        <aside className="hidden md:flex w-[320px] lg:w-[340px] glass-panel shadow-[-4px_0_15px_rgba(0,0,0,0.03)] z-10 flex-col shrink-0 border-l border-white/60">
                            <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-white/50">
                                <h2 className="text-base lg:text-lg font-black flex items-center gap-2 text-slate-800">
                                    <span className="text-blue-600 bg-blue-100 p-1.5 rounded-lg flex items-center justify-center">
                                        <Icons.List />
                                    </span>
                                    مراحل ساخت من
                                </h2>
                                <div className="flex gap-1.5">
                                    <button onClick={handleUndo} disabled={history.length===0 || isAnimating} className="w-9 h-9 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-700 hover:text-blue-600 hover:bg-blue-50 disabled:opacity-30 transition" title="مرحله قبل (Undo)">
                                        <Icons.Undo />
                                    </button>
                                    <button onClick={handleRedo} disabled={redoStack.length===0 || isAnimating} className="w-9 h-9 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-700 hover:text-blue-600 hover:bg-blue-50 disabled:opacity-30 transition" title="مرحله بعد (Redo)">
                                        <Icons.Redo />
                                    </button>
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 relative">
                                {history.length === 0 ? (
                                    <div className="text-center text-slate-400 text-sm mt-16 flex flex-col items-center gap-2">
                                        <span className="opacity-25 text-3xl"><Icons.Shapes /></span>
                                        هنوز حرکتی انجام نداده‌اید.
                                    </div>
                                ) : (
                                    history.map((item, idx) => (
                                        <div key={idx} className="bg-white/95 border border-slate-200 rounded-xl p-3 text-sm shadow-sm relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-1.5 h-full" style={{backgroundColor: getPieceColor(item.pieceId)}}></div>
                                            <div className="font-bold text-slate-800 flex items-center gap-2 mb-1 pr-2">
                                                <span className="text-[10px] bg-slate-100 text-slate-500 w-5 h-5 flex items-center justify-center rounded-full font-black">{idx+1}</span>
                                                {item.name}
                                            </div>
                                            <div className="text-slate-600 pr-2 text-xs font-medium leading-relaxed">{item.desc}</div>
                                        </div>
                                    ))
                                )}
                            </div>
                            <div className="p-4 border-t border-slate-200 bg-white/50">
                                <button onClick={()=>setShowReport(true)} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:shadow-lg hover:shadow-blue-500/30 font-black transition-all flex items-center justify-center gap-2 transform active:scale-95 text-sm">
                                    <Icons.List /> گزارش نهایی کار
                                </button>
                            </div>
                        </aside>

                        {/* کشوی مراحل موبایل */}
                        {showMobileHistory && (
                            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm md:hidden flex flex-col justify-end">
                                <div className="bg-white rounded-t-3xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                        <div className="flex items-center gap-2 font-black text-slate-800">
                                            <Icons.List /> مراحل ساخت من
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={handleUndo} disabled={history.length===0 || isAnimating} className="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-700 disabled:opacity-30">
                                                <Icons.Undo />
                                            </button>
                                            <button onClick={handleRedo} disabled={redoStack.length===0 || isAnimating} className="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-700 disabled:opacity-30">
                                                <Icons.Redo />
                                            </button>
                                            <button onClick={()=>setShowMobileHistory(false)} className="w-8 h-8 rounded-lg bg-slate-200 flex items-center justify-center text-slate-700 mr-2">
                                                <Icons.Close />
                                            </button>
                                        </div>
                                    </div>
                                    <div className="p-4 overflow-y-auto space-y-2.5 flex-1">
                                        {history.length === 0 ? (
                                            <div className="text-center text-slate-400 py-8 text-sm">هنوز حرکتی انجام نداده‌اید.</div>
                                        ) : (
                                            history.map((item, idx) => (
                                                <div key={idx} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm flex gap-3 items-center">
                                                    <div className="w-2 h-8 rounded-full" style={{backgroundColor: getPieceColor(item.pieceId)}}></div>
                                                    <div className="flex-1">
                                                        <div className="font-bold text-xs text-slate-800">{item.name}</div>
                                                        <div className="text-[11px] text-slate-500 font-medium">{item.desc}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="p-4 border-t border-slate-100 bg-white">
                                        <button onClick={()=>{ setShowMobileHistory(false); setShowReport(true); }} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-black text-sm flex items-center justify-center gap-2">
                                            <Icons.List /> مشاهده گزارش نهایی
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* فوتر */}
                    <footer className="bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 md:py-3 text-center text-xs md:text-[13px] text-slate-500 z-20 shrink-0 font-medium">
                        طراحی و توسعه با <Icons.Heart /> توسط <span className="font-black text-transparent bg-clip-text bg-gradient-to-l from-blue-600 to-indigo-600 px-1">علی حکیمی</span>
                    </footer>

                    {/* پیام تبریک تکمیل مربع */}
                    {isWon && !showReport && (
                        <div className="fixed top-16 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-5 md:px-8 py-3 md:py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 animate-bounce border border-emerald-400">
                            <div className="p-1 bg-emerald-400/40 rounded-full flex items-center justify-center">
                                <Icons.Check />
                            </div>
                            <span className="font-black text-sm md:text-xl tracking-wide">آفرین! مربع با موفقیت کامل شد.</span>
                        </div>
                    )}

                    {/* مودال گزارش نهایی */}
                    {showReport && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-3 md:p-6">
                            <div className="bg-white rounded-2xl md:rounded-3xl shadow-2xl w-full max-w-3xl flex flex-col h-[88vh] md:h-[82vh] overflow-hidden border border-slate-100">
                                <div className="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/70">
                                    <div>
                                        <h2 className="text-base md:text-2xl font-black text-slate-800 flex items-center gap-2 md:gap-3">
                                            <span className="text-blue-600 bg-blue-100 p-2 rounded-xl flex items-center justify-center">
                                                <Icons.List />
                                            </span>
                                            گزارش روش حل هندسی
                                        </h2>
                                        <p className="text-slate-500 text-xs md:text-sm mt-1 font-medium">لیست کامل تبدیلات انجام شده روی قطعات</p>
                                    </div>
                                    <button onClick={()=>setShowReport(false)} className="w-8 h-8 md:w-10 md:h-10 bg-white shadow-sm border border-slate-200 rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition flex items-center justify-center">
                                        <Icons.Close />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50/40">
                                    {history.length === 0 ? (
                                        <div className="text-center text-slate-400 mt-20 text-base md:text-lg font-bold">هیچ داده‌ای ثبت نشده است.</div>
                                    ) : (
                                        <div className="space-y-3 md:space-y-4">
                                            {history.map((h, i) => (
                                                <div key={i} className="bg-white p-3 md:p-4 rounded-xl md:rounded-2xl shadow-sm border border-slate-100 flex gap-3 md:gap-5 items-center">
                                                    <div className="w-8 h-8 md:w-11 md:h-11 shrink-0 rounded-full flex items-center justify-center text-white font-black text-xs md:text-base shadow-inner" style={{backgroundColor: getPieceColor(h.pieceId)}}>
                                                        {i+1}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h3 className="font-black text-sm md:text-base text-slate-800">{h.name}</h3>
                                                    </div>
                                                    <div className="bg-blue-50 text-blue-800 px-3 md:px-5 py-1.5 md:py-2 rounded-xl font-bold text-xs md:text-sm border border-blue-100">
                                                        {h.desc}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 md:p-6 border-t border-slate-100 bg-white flex justify-end">
                                    <button onClick={()=>setShowReport(false)} className="w-full sm:w-auto px-6 md:px-8 py-2.5 md:py-3 bg-slate-100 text-slate-700 font-black rounded-xl hover:bg-slate-200 transition text-sm">بستن گزارش</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
