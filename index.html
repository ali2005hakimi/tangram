<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آزمایشگاه تبدیلات هندسی تنگرام</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Vazirmatn Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #f1f5f9, #e2e8f0);
            user-select: none;
            overflow: hidden; 
            overscroll-behavior: none;
        }
        
        .polygon { 
            transition: stroke-width 0.2s; 
            cursor: grab; 
            -webkit-tap-highlight-color: transparent;
        }
        .polygon:active { cursor: grabbing; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f8fafc; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        canvas, svg { touch-action: none; outline: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CELL_SIZE = 45; 

        const INITIAL_PIECES = [
            { id: 'lt1', name: 'مثلث بزرگ آبی', color: '#3b82f6', vertices: [{x:-14,y:9}, {x:-6,y:9}, {x:-10,y:5}] },
            { id: 'lt2', name: 'مثلث بزرگ قرمز', color: '#ef4444', vertices: [{x:6,y:9}, {x:6,y:1}, {x:10,y:5}] },
            { id: 'mt', name: 'مثلث متوسط سبز', color: '#10b981', vertices: [{x:-6,y:-1}, {x:-6,y:-5}, {x:-10,y:-5}] },
            { id: 'sq', name: 'مربع نارنجی', color: '#f97316', vertices: [{x:10,y:-5}, {x:12,y:-3}, {x:14,y:-5}, {x:12,y:-7}] },
            { id: 'st1', name: 'مثلث کوچک زرد', color: '#eab308', vertices: [{x:-14,y:0}, {x:-12,y:2}, {x:-14,y:4}] },
            { id: 'st2', name: 'مثلث کوچک فیروزه‌ای', color: '#06b6d4', vertices: [{x:14,y:4}, {x:14,y:0}, {x:12,y:2}] },
            { id: 'para', name: 'متوازی‌الاضلاع بنفش', color: '#8b5cf6', vertices: [{x:-2,y:-9}, {x:2,y:-9}, {x:4,y:-7}, {x:0,y:-7}] }
        ];

        const getCenter = (pts) => {
            let minX = Math.min(...pts.map(p=>p.x)), maxX = Math.max(...pts.map(p=>p.x));
            let minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
            return { x: (minX+maxX)/2, y: (minY+maxY)/2, maxY };
        };

        const pointInPolygon = (pt, vs) => {
            let inside = false;
            for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
                let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
                let intersect = ((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        };

        const App = () => {
            const [pieces, setPieces] = useState(INITIAL_PIECES);
            const [selectedId, setSelectedId] = useState(null);
            const [history, setHistory] = useState([]);
            const [redoStack, setRedoStack] = useState([]);
            const [isWon, setIsWon] = useState(false);
            const [showGrid, setShowGrid] = useState(true);
            const [showReport, setShowReport] = useState(false);
            const [showMobileHistory, setShowMobileHistory] = useState(false);
            const [isAnimating, setIsAnimating] = useState(false);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            
            // Camera
            const [cam, setCam] = useState({ x: 0, y: 0, zoom: window.innerWidth < 768 ? 0.72 : 1 });
            const svgRef = useRef(null);
            const containerRef = useRef(null);
            const [containerSize, setContainerSize] = useState({ w: 800, h: 600 });
            
            // Touch tracking for pinch-zoom
            const touchesRef = useRef({});

            useEffect(() => {
                const resize = () => {
                    const mobile = window.innerWidth < 768;
                    setIsMobile(mobile);
                    if (containerRef.current) {
                        setContainerSize({ 
                            w: containerRef.current.clientWidth, 
                            h: containerRef.current.clientHeight 
                        });
                    }
                };
                window.addEventListener('resize', resize);
                resize();
                return () => window.removeEventListener('resize', resize);
            }, []);

            // مدیریت Wheel با دقت مناسب برای لپ‌تاپ
            useEffect(() => {
                const svg = svgRef.current;
                if (!svg) return;
                const handleWheel = (e) => {
                    e.preventDefault();
                    const zoomDelta = e.deltaY > 0 ? 0.9 : 1.1;
                    applyZoom(zoomDelta, e.clientX, e.clientY);
                };
                svg.addEventListener('wheel', handleWheel, { passive: false });
                return () => svg.removeEventListener('wheel', handleWheel);
            }, [cam, containerSize]);

            // اعمال زوم نرم حول نقطه مرکز یا موقعیت نشانگر
            const applyZoom = (factor, clientX = null, clientY = null) => {
                const newZoom = Math.min(Math.max(0.4, cam.zoom * factor), 3.0);
                if (clientX === null || clientY === null) {
                    setCam(c => ({ ...c, zoom: newZoom }));
                    return;
                }
                const rect = containerRef.current.getBoundingClientRect();
                const mouseX = clientX - rect.left;
                const mouseY = clientY - rect.top;
                
                const camX = mouseX - (mouseX - containerSize.w/2 - cam.x) * (newZoom / cam.zoom) - containerSize.w/2;
                const camY = mouseY - (mouseY - containerSize.h/2 - cam.y) * (newZoom / cam.zoom) - containerSize.h/2;
                setCam({ x: camX, y: camY, zoom: newZoom });
            };

            const getMathCoords = (screenX, screenY) => {
                const mathX = (screenX - (containerSize.w/2 + cam.x)) / (CELL_SIZE * cam.zoom);
                const mathY = -(screenY - (containerSize.h/2 + cam.y)) / (CELL_SIZE * cam.zoom);
                return { x: mathX, y: mathY };
            };

            const getScreenCoords = (mathX, mathY) => {
                return {
                    x: containerSize.w/2 + cam.x + mathX * CELL_SIZE * cam.zoom,
                    y: containerSize.h/2 + cam.y - mathY * CELL_SIZE * cam.zoom
                };
            };

            const checkWinGeometric = (currentPieces) => {
                for(let p of currentPieces) {
                    for(let v of p.vertices) {
                        if(v.x < -4.01 || v.x > 4.01 || v.y < -4.01 || v.y > 4.01) return false;
                    }
                }
                const eps1 = 0.1137, eps2 = 0.1472; 
                for(let i=0; i<32; i++){
                    for(let j=0; j<32; j++){
                        let pt = { x: -4 + eps1 + i * 0.25, y: -4 + eps2 + j * 0.25 };
                        let insideCount = 0;
                        for(let p of currentPieces) {
                            if(pointInPolygon(pt, p.vertices)) insideCount++;
                        }
                        if(insideCount !== 1) return false; 
                    }
                }
                setIsWon(true);
                return true;
            };

            const pushHistory = (pieceId, desc, newPieces) => {
                const prev = pieces.find(x => x.id === pieceId).vertices;
                const next = newPieces.find(x => x.id === pieceId).vertices;
                setHistory(h => [...h, { pieceId, name: getPieceName(pieceId), desc, prev, next }]);
                setRedoStack([]);
                setPieces(newPieces);
                checkWinGeometric(newPieces);
            };

            const [dragInfo, setDragInfo] = useState(null);
            const [panInfo, setPanInfo] = useState(null);

            const onPointerDownCanvas = (e) => {
                if(isAnimating) return;
                touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                
                // هندل کردن Pinch با دو انگشت روی تاچ اسکرین
                const touchKeys = Object.keys(touchesRef.current);
                if (touchKeys.length === 2) {
                    const t1 = touchesRef.current[touchKeys[0]];
                    const t2 = touchesRef.current[touchKeys[1]];
                    const initialDist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
                    touchesRef.current.initialDist = initialDist;
                    touchesRef.current.initialZoom = cam.zoom;
                    return;
                }

                if(e.target.tagName !== 'svg') return;
                setPanInfo({ startX: e.clientX, startY: e.clientY, camX: cam.x, camY: cam.y });
                setSelectedId(null);
            };

            const onPointerDownPiece = (e, id) => {
                if (isAnimating) return;
                e.stopPropagation();
                touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                setSelectedId(id);
                const pt = getMathCoords(e.clientX, e.clientY);
                setDragInfo({ id, startPt: pt, startVerts: pieces.find(p=>p.id===id).vertices });
            };

            const onPointerMove = (e) => {
                if (isAnimating) return;
                if (touchesRef.current[e.pointerId]) {
                    touchesRef.current[e.pointerId] = { x: e.clientX, y: e.clientY };
                }

                // هندلینگ زوم دو انگشتی
                const touchKeys = Object.keys(touchesRef.current).filter(k => k !== 'initialDist' && k !== 'initialZoom');
                if (touchKeys.length === 2 && touchesRef.current.initialDist) {
                    const t1 = touchesRef.current[touchKeys[0]];
                    const t2 = touchesRef.current[touchKeys[1]];
                    const dist = Math.hypot(t1.x - t2.x, t1.y - t2.y);
                    const zoomFactor = dist / touchesRef.current.initialDist;
                    const targetZoom = Math.min(Math.max(0.4, touchesRef.current.initialZoom * zoomFactor), 3.0);
                    setCam(c => ({ ...c, zoom: targetZoom }));
                    return;
                }

                if (panInfo) {
                    setCam({ ...cam, x: panInfo.camX + (e.clientX - panInfo.startX), y: panInfo.camY + (e.clientY - panInfo.startY) });
                } else if (dragInfo) {
                    const pt = getMathCoords(e.clientX, e.clientY);
                    let dx = Math.round(pt.x - dragInfo.startPt.x);
                    let dy = Math.round(pt.y - dragInfo.startPt.y);
                    
                    setPieces(prev => prev.map(p => p.id === dragInfo.id ? { 
                        ...p, vertices: dragInfo.startVerts.map(v => ({ x: v.x + dx, y: v.y + dy })) 
                    } : p));
                }
            };

            const onPointerUp = (e) => {
                if (e && e.pointerId) {
                    delete touchesRef.current[e.pointerId];
                    if (Object.keys(touchesRef.current).length < 2) {
                        delete touchesRef.current.initialDist;
                        delete touchesRef.current.initialZoom;
                    }
                }
                if (panInfo) setPanInfo(null);
                if (dragInfo) {
                    const p = pieces.find(x => x.id === dragInfo.id);
                    const dx = p.vertices[0].x - dragInfo.startVerts[0].x;
                    const dy = p.vertices[0].y - dragInfo.startVerts[0].y;
                    if (Math.abs(dx)>0.1 || Math.abs(dy)>0.1) {
                        const dirX = dx>0 ? 'راست' : dx<0 ? 'چپ' : '';
                        const dirY = dy>0 ? 'بالا' : dy<0 ? 'پایین' : '';
                        const parts = [];
                        if(dx!==0) parts.push(`${Math.abs(Math.round(dx))} خانه به ${dirX}`);
                        if(dy!==0) parts.push(`${Math.abs(Math.round(dy))} خانه به ${dirY}`);
                        pushHistory(dragInfo.id, `انتقال ${parts.join(' و ')}`, pieces);
                    }
                    setDragInfo(null);
                }
            };

            const executeDirectRotate = (id, angle) => {
                if (isAnimating) return;
                setIsAnimating(true);
                
                const p = pieces.find(x => x.id === id);
                const c = getCenter(p.vertices);
                const startVerts = p.vertices;
                const duration = 360;
                const start = performance.now();

                const frame = (now) => {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const currentAngle = angle * ease;
                    
                    const rad = (-currentAngle) * Math.PI / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);

                    const currentVerts = startVerts.map(pt => ({
                        x: c.x + (pt.x - c.x)*cos - (pt.y - c.y)*sin,
                        y: c.y + (pt.x - c.x)*sin + (pt.y - c.y)*cos
                    }));

                    setPieces(prev => prev.map(x => x.id === id ? { ...x, vertices: currentVerts } : x));

                    if (progress < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        const finalRad = (-angle) * Math.PI / 180;
                        const finalCos = Math.round(Math.cos(finalRad));
                        const finalSin = Math.round(Math.sin(finalRad));
                        
                        const finalVerts = startVerts.map(pt => ({
                            x: c.x + (pt.x - c.x)*finalCos - (pt.y - c.y)*finalSin,
                            y: c.y + (pt.x - c.x)*finalSin + (pt.y - c.y)*finalCos
                        }));
                        
                        const newPieces = pieces.map(x => x.id === id ? { ...x, vertices: finalVerts } : x);
                        pushHistory(id, `دوران ${angle} درجه`, newPieces);
                        setIsAnimating(false);
                    }
                };
                requestAnimationFrame(frame);
            };

            const executeDirectReflect = (id) => {
                if (isAnimating) return;
                setIsAnimating(true);

                const p = pieces.find(x => x.id === id);
                const c = getCenter(p.vertices);
                const startVerts = p.vertices;
                const targetVerts = p.vertices.map(v => ({ x: 2*c.x - v.x, y: v.y }));
                
                const duration = 300;
                const start = performance.now();

                const frame = (now) => {
                    const elapsed = now - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    const currentVerts = startVerts.map((v, i) => ({
                        x: v.x + (targetVerts[i].x - v.x) * ease,
                        y: v.y + (targetVerts[i].y - v.y) * ease
                    }));

                    setPieces(prev => prev.map(x => x.id === id ? { ...x, vertices: currentVerts } : x));

                    if (progress < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        const newPieces = pieces.map(x => x.id === id ? { ...x, vertices: targetVerts } : x);
                        pushHistory(id, `قرینه`, newPieces);
                        setIsAnimating(false);
                    }
                };
                requestAnimationFrame(frame);
            };

            const handleUndo = () => {
                if (!history.length || isAnimating) return;
                const last = history[history.length - 1];
                setPieces(prev => prev.map(p => p.id === last.pieceId ? { ...p, vertices: last.prev } : p));
                setRedoStack([last, ...redoStack]);
                setHistory(history.slice(0, -1));
                setIsWon(false);
            };

            const handleRedo = () => {
                if (!redoStack.length || isAnimating) return;
                const next = redoStack[0];
                const newPieces = pieces.map(p => p.id === next.pieceId ? { ...p, vertices: next.next } : p);
                setPieces(newPieces);
                setHistory([...history, next]);
                setRedoStack(redoStack.slice(1));
                checkWinGeometric(newPieces);
            };

            const handleReset = () => {
                if (isAnimating) return;
                if(confirm('آیا مطمئن هستید که می‌خواهید همه چیز را از اول شروع کنید؟')) {
                    setPieces(INITIAL_PIECES);
                    setHistory([]);
                    setRedoStack([]);
                    setSelectedId(null);
                    setCam({ x: 0, y: 0, zoom: isMobile ? 0.72 : 1 });
                    setIsWon(false);
                }
            };

            const getPieceName = (id) => INITIAL_PIECES.find(p=>p.id===id)?.name || id;
            const getPieceColor = (id) => INITIAL_PIECES.find(p=>p.id===id)?.color || '#94a3b8';

            const renderGrid = () => {
                if(!showGrid) return null;
                const lines = [];
                for(let i=-30; i<=30; i++) {
                    const isAxis = i === 0;
                    const stroke = isAxis ? "#94a3b8" : "#cbd5e1";
                    const w = isAxis ? 2.5 : 1;
                    lines.push(<line key={`v${i}`} x1={i} y1={-30} x2={i} y2={30} stroke={stroke} strokeWidth={w/CELL_SIZE} opacity={isAxis ? 0.7 : 0.4} />);
                    lines.push(<line key={`h${i}`} x1={-30} y1={i} x2={30} y2={i} stroke={stroke} strokeWidth={w/CELL_SIZE} opacity={isAxis ? 0.7 : 0.4} />);
                }
                return <g>{lines}</g>;
            };

            const selectedPiece = pieces.find(x => x.id === selectedId);

            return (
                <div className="h-full flex flex-col select-none">
                    {/* Header */}
                    <header className="h-14 md:h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-3 md:px-6 z-20 shrink-0 shadow-sm">
                        <div className="flex items-center gap-2 md:gap-3">
                            <div className="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-2 rounded-xl shadow-md text-sm md:text-base">
                                <i className="fa-solid fa-shapes"></i>
                            </div>
                            <h1 className="text-sm md:text-xl font-black text-slate-800 tracking-tight">آزمایشگاه هندسه: ساخت مربع</h1>
                        </div>
                        <div className="flex items-center gap-1.5 md:gap-3">
                            <button onClick={()=>setCam({x:0, y:0, zoom: isMobile ? 0.72 : 1})} className="text-slate-600 hover:text-blue-600 text-xs md:text-sm flex items-center gap-1.5 border border-slate-200 px-2.5 py-1.5 rounded-lg hover:bg-white transition bg-slate-50/50 font-bold" title="تنظیم زاویه دید">
                                <i className="fa-solid fa-expand"></i> <span className="hidden sm:inline">مرکز</span>
                            </button>
                            <button onClick={()=>setShowGrid(!showGrid)} className="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition" title="نمایش شبکه">
                                <i className={`fa-solid fa-border-all ${showGrid ? 'text-blue-600' : ''}`}></i>
                            </button>
                            <button onClick={handleReset} className="w-8 h-8 md:w-9 md:h-9 flex items-center justify-center rounded-lg text-slate-500 hover:text-red-600 hover:bg-red-50 transition" title="شروع دوباره">
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>

                            {/* دکمه اختصاصی باز کردن گزارش در موبایل */}
                            <button onClick={()=>setShowMobileHistory(true)} className="md:hidden flex items-center gap-1.5 bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg font-bold text-xs border border-blue-200">
                                <i className="fa-solid fa-list-ol"></i> مراحل
                                {history.length > 0 && <span className="bg-blue-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">{history.length}</span>}
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-hidden relative">
                        
                        {/* محیط کاری (Canvas) */}
                        <div ref={containerRef} className="flex-1 relative overflow-hidden cursor-move">
                            <svg ref={svgRef} 
                                 width="100%" height="100%" 
                                 onPointerDown={onPointerDownCanvas}
                                 onPointerMove={onPointerMove} 
                                 onPointerUp={onPointerUp} 
                                 onPointerLeave={onPointerUp}
                                 className="absolute inset-0 block">
                                
                                <g transform={`translate(${containerSize.w/2 + cam.x}, ${containerSize.h/2 + cam.y}) scale(${cam.zoom}, ${cam.zoom})`}>
                                    <g transform={`scale(${CELL_SIZE}, ${-CELL_SIZE})`}>
                                        
                                        {renderGrid()}

                                        {/* مربع هدف */}
                                        <rect x="-4" y="-4" width="8" height="8" fill="rgba(59, 130, 246, 0.04)" stroke="#64748b" strokeWidth={3/CELL_SIZE} strokeDasharray={`${8/CELL_SIZE} ${6/CELL_SIZE}`} pointerEvents="none" rx={2/CELL_SIZE}/>
                                        <g transform="scale(1, -1)" pointerEvents="none">
                                            <text x="0" y="0" textAnchor="middle" dominantBaseline="middle" fill="#94a3b8" fontSize={24/CELL_SIZE} className="font-black pointer-events-none opacity-50" style={{fontFamily:'Vazirmatn'}}>مربع هدف</text>
                                        </g>

                                        {/* قطعات تنگرام */}
                                        {pieces.map(p => (
                                            <polygon
                                                key={p.id}
                                                points={p.vertices.map(v => `${v.x},${v.y}`).join(' ')}
                                                fill={p.color}
                                                stroke="rgba(0,0,0,0.18)"
                                                strokeWidth={(selectedId === p.id ? 3.5 : 1.5)/CELL_SIZE}
                                                strokeLinejoin="round"
                                                className="polygon"
                                                onPointerDown={(e) => onPointerDownPiece(e, p.id)}
                                                style={{ filter: selectedId === p.id ? 'drop-shadow(0px 8px 14px rgba(0,0,0,0.45))' : 'drop-shadow(0px 3px 6px rgba(0,0,0,0.22))' }}
                                            />
                                        ))}
                                    </g>
                                </g>
                            </svg>

                            {/* کنترل اختصاصی زوم آسان و سریع (عالی برای لپ‌تاپ و تخته هوشمند) */}
                            <div className="absolute right-4 bottom-5 flex flex-col gap-2 z-20">
                                <button onClick={()=>applyZoom(1.25)} className="w-10 h-10 md:w-11 md:h-11 bg-white/95 hover:bg-white text-slate-700 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-black text-lg transition active:scale-95" title="بزرگنمایی">
                                    <i className="fa-solid fa-plus"></i>
                                </button>
                                <button onClick={()=>applyZoom(0.8)} className="w-10 h-10 md:w-11 md:h-11 bg-white/95 hover:bg-white text-slate-700 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-black text-lg transition active:scale-95" title="کوچک‌نمایی">
                                    <i className="fa-solid fa-minus"></i>
                                </button>
                                <button onClick={()=>setCam({x:0, y:0, zoom: isMobile ? 0.72 : 1})} className="w-10 h-10 md:w-11 md:h-11 bg-white/95 hover:bg-white text-blue-600 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-black text-sm transition active:scale-95" title="بازنشانی زوم و مرکز">
                                    100%
                                </button>
                            </div>

                            {/* UI ابزار دوران و تقارن (در دسکتاپ شناور کنار قطعه، در موبایل ثابت و ارگونومیک در پایین بوم) */}
                            {selectedPiece && !dragInfo && !isAnimating && (
                                isMobile ? (
                                    <div className="absolute bottom-4 left-4 right-16 glass-panel p-2 rounded-2xl border border-white/80 shadow-2xl flex flex-col gap-1.5 z-30 animate-fade-in">
                                        <div className="flex justify-between items-center px-2">
                                            <span className="text-xs font-black text-slate-700">{selectedPiece.name}</span>
                                            <span className="text-[10px] text-slate-400">برای حرکت شکل را لمس کرده و بکشید</span>
                                        </div>
                                        <div className="flex gap-1.5">
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 90)} className="flex-1 py-2 bg-blue-50 text-blue-700 rounded-lg font-black text-xs">90°</button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 180)} className="flex-1 py-2 bg-blue-50 text-blue-700 rounded-lg font-black text-xs">180°</button>
                                            <button onClick={()=>executeDirectRotate(selectedPiece.id, 270)} className="flex-1 py-2 bg-blue-50 text-blue-700 rounded-lg font-black text-xs">270°</button>
                                            <button onClick={()=>executeDirectReflect(selectedPiece.id)} className="flex-1 py-2 bg-indigo-50 text-indigo-700 rounded-lg font-black text-xs flex items-center justify-center gap-1">
                                                <i className="fa-solid fa-object-group"></i> قرینه
                                            </button>
                                        </div>
                                    </div>
                                ) : (() => {
                                    const c = getCenter(selectedPiece.vertices);
                                    const maxR = Math.max(...selectedPiece.vertices.map(v => Math.hypot(v.x - c.x, v.y - c.y)));
                                    const sc = getScreenCoords(c.x + maxR + 0.5, c.y); 
                                    return (
                                        <div className="absolute glass-panel shadow-2xl border border-white rounded-xl flex flex-col overflow-hidden z-30 animate-fade-in w-44" 
                                             style={{ left: Math.min(sc.x, containerSize.w - 190), top: Math.max(20, Math.min(sc.y, containerSize.h - 150)), transform: 'translateY(-50%)' }}>
                                            <div className="bg-slate-50/80 text-[11px] font-black px-3 py-2 border-b border-slate-200 text-center text-slate-700 uppercase tracking-wider">{selectedPiece.name}</div>
                                            
                                            <div className="flex border-b border-slate-200 bg-white/50">
                                                <button onClick={()=>executeDirectRotate(selectedPiece.id, 90)} className="flex-1 py-2.5 hover:bg-blue-100 text-blue-700 font-bold transition text-[14px] border-l border-slate-200" title="دوران ۹۰ درجه">
                                                    90°
                                                </button>
                                                <button onClick={()=>executeDirectRotate(selectedPiece.id, 180)} className="flex-1 py-2.5 hover:bg-blue-100 text-blue-700 font-bold transition text-[14px] border-l border-slate-200" title="دوران ۱۸۰ درجه">
                                                    180°
                                                </button>
                                                <button onClick={()=>executeDirectRotate(selectedPiece.id, 270)} className="flex-1 py-2.5 hover:bg-blue-100 text-blue-700 font-bold transition text-[14px]" title="دوران ۲۷۰ درجه">
                                                    270°
                                                </button>
                                            </div>

                                            <button onClick={()=>executeDirectReflect(selectedPiece.id)} className="w-full py-3 text-[14px] hover:bg-indigo-100 text-indigo-700 bg-white/50 font-bold flex items-center justify-center gap-2 transition">
                                                <i className="fa-solid fa-object-group"></i> قرینه
                                            </button>
                                            
                                            <div className="py-2 text-[10px] text-slate-500 bg-slate-100/80 border-t border-slate-200 text-center font-medium">
                                                <i className="fa-solid fa-arrows-up-down-left-right text-slate-400"></i> برای انتقال شکل را بکشید
                                            </div>
                                        </div>
                                    );
                                })()
                            )}
                        </div>

                        {/* سایدبار دسکتاپ */}
                        <aside className="hidden md:flex w-[320px] lg:w-[340px] glass-panel shadow-[-4px_0_15px_rgba(0,0,0,0.03)] z-10 flex-col shrink-0 border-l border-white/50">
                            <div className="p-5 border-b border-slate-200 flex justify-between items-center bg-white/40">
                                <h2 className="text-base lg:text-lg font-black flex items-center gap-2 text-slate-800">
                                    <i className="fa-solid fa-list-ol text-blue-500 bg-blue-100 p-1.5 rounded-lg"></i>
                                    مراحل ساخت من
                                </h2>
                                <div className="flex gap-1.5">
                                    <button onClick={handleUndo} disabled={history.length===0 || isAnimating} className="w-9 h-9 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-blue-50 disabled:opacity-40 transition">
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                    <button onClick={handleRedo} disabled={redoStack.length===0 || isAnimating} className="w-9 h-9 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-blue-50 disabled:opacity-40 transition">
                                        <i className="fa-solid fa-rotate-left"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 relative">
                                {history.length === 0 ? (
                                    <div className="text-center text-slate-400 text-sm mt-12 flex flex-col items-center gap-3">
                                        <i className="fa-solid fa-shapes text-4xl opacity-20"></i>
                                        هنوز حرکتی انجام نداده‌اید.
                                    </div>
                                ) : (
                                    history.map((item, idx) => (
                                        <div key={idx} className="bg-white/85 border border-slate-200 rounded-xl p-3 text-sm shadow-sm relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-1.5 h-full" style={{backgroundColor: getPieceColor(item.pieceId)}}></div>
                                            <div className="font-bold text-slate-800 flex items-center gap-2 mb-1 pr-2">
                                                <span className="text-[10px] bg-slate-100 text-slate-500 w-5 h-5 flex items-center justify-center rounded-full font-black">{idx+1}</span>
                                                {item.name}
                                            </div>
                                            <div className="text-slate-600 pr-2 text-xs font-medium leading-relaxed">{item.desc}</div>
                                        </div>
                                    ))
                                )}
                            </div>
                            <div className="p-4 border-t border-slate-200 bg-white/40">
                                <button onClick={()=>setShowReport(true)} className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:shadow-lg hover:shadow-blue-500/30 font-black transition-all flex items-center justify-center gap-2 transform active:scale-95 text-sm">
                                    <i className="fa-solid fa-file-invoice"></i> گزارش نهایی کار
                                </button>
                            </div>
                        </aside>

                        {/* مودال و پنجره کشویی مراحل در موبایل (Bottom Sheet) */}
                        {showMobileHistory && (
                            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm md:hidden flex flex-col justify-end">
                                <div className="bg-white rounded-t-3xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                        <div className="flex items-center gap-2 font-black text-slate-800">
                                            <i className="fa-solid fa-list-ol text-blue-600"></i> مراحل ساخت من
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={handleUndo} disabled={history.length===0 || isAnimating} className="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 disabled:opacity-30">
                                                <i className="fa-solid fa-rotate-right text-xs"></i>
                                            </button>
                                            <button onClick={handleRedo} disabled={redoStack.length===0 || isAnimating} className="w-8 h-8 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-slate-600 disabled:opacity-30">
                                                <i className="fa-solid fa-rotate-left text-xs"></i>
                                            </button>
                                            <button onClick={()=>setShowMobileHistory(false)} className="w-8 h-8 rounded-lg bg-slate-200 flex items-center justify-center text-slate-700 mr-2">
                                                <i className="fa-solid fa-xmark text-sm"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="p-4 overflow-y-auto space-y-2.5 flex-1">
                                        {history.length === 0 ? (
                                            <div className="text-center text-slate-400 py-8 text-sm">هنوز حرکتی انجام نداده‌اید.</div>
                                        ) : (
                                            history.map((item, idx) => (
                                                <div key={idx} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm flex gap-3 items-center">
                                                    <div className="w-2.5 h-8 rounded-full" style={{backgroundColor: getPieceColor(item.pieceId)}}></div>
                                                    <div className="flex-1">
                                                        <div className="font-bold text-xs text-slate-800">{item.name}</div>
                                                        <div className="text-[11px] text-slate-500 font-medium">{item.desc}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="p-4 border-t border-slate-100 bg-white">
                                        <button onClick={()=>{ setShowMobileHistory(false); setShowReport(true); }} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-black text-sm flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-file-invoice"></i> مشاهده گزارش نهایی
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* فوتر مدرن */}
                    <footer className="bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 md:py-3 text-center text-xs md:text-[13px] text-slate-500 z-20 shrink-0 font-medium">
                        طراحی و توسعه با <i className="fa-solid fa-heart text-rose-500 animate-pulse mx-1"></i> توسط <span className="font-black text-transparent bg-clip-text bg-gradient-to-l from-blue-600 to-indigo-600 px-1">علی حکیمی</span>
                    </footer>

                    {/* پیام موفقیت */}
                    {isWon && !showReport && (
                        <div className="fixed top-16 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-5 md:px-8 py-3 md:py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 animate-bounce border border-emerald-400">
                            <i className="fa-solid fa-circle-check text-2xl md:text-3xl"></i>
                            <span className="font-black text-sm md:text-xl tracking-wide">آفرین! مربع با موفقیت کامل شد.</span>
                        </div>
                    )}

                    {/* Modal گزارش حرفه‌ای */}
                    {showReport && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-3 md:p-6">
                            <div className="bg-white rounded-2xl md:rounded-3xl shadow-2xl w-full max-w-3xl flex flex-col h-[90vh] md:h-[85vh] overflow-hidden border border-slate-100">
                                <div className="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                    <div>
                                        <h2 className="text-base md:text-2xl font-black text-slate-800 flex items-center gap-2 md:gap-3">
                                            <i className="fa-solid fa-clipboard-check text-blue-600 bg-blue-100 p-1.5 md:p-2 rounded-xl"></i> گزارش روش حل هندسی
                                        </h2>
                                        <p className="text-slate-500 text-xs md:text-sm mt-1 font-medium">لیست دقیق تبدیلات انجام شده روی قطعات</p>
                                    </div>
                                    <button onClick={()=>setShowReport(false)} className="w-8 h-8 md:w-10 md:h-10 bg-white shadow-sm border border-slate-200 rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition flex items-center justify-center">
                                        <i className="fa-solid fa-xmark text-sm md:text-lg"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50/30">
                                    {history.length === 0 ? (
                                        <div className="text-center text-slate-400 mt-20 text-base md:text-lg font-bold">هیچ داده‌ای ثبت نشده است.</div>
                                    ) : (
                                        <div className="space-y-3 md:space-y-4">
                                            {history.map((h, i) => (
                                                <div key={i} className="bg-white p-3 md:p-4 rounded-xl md:rounded-2xl shadow-sm border border-slate-100 flex gap-3 md:gap-5 items-center">
                                                    <div className="w-9 h-9 md:w-12 md:h-12 shrink-0 rounded-full flex items-center justify-center text-white font-black text-sm md:text-lg shadow-inner" style={{backgroundColor: getPieceColor(h.pieceId)}}>
                                                        {i+1}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h3 className="font-black text-sm md:text-lg text-slate-800">{h.name}</h3>
                                                    </div>
                                                    <div className="bg-blue-50 text-blue-800 px-3 md:px-5 py-1.5 md:py-2 rounded-xl font-bold text-xs md:text-sm border border-blue-100">
                                                        {h.desc}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 md:p-6 border-t border-slate-100 bg-white flex justify-end">
                                    <button onClick={()=>setShowReport(false)} className="w-full sm:w-auto px-6 md:px-8 py-2.5 md:py-3 bg-slate-100 text-slate-700 font-black rounded-xl hover:bg-slate-200 transition text-sm">بستن گزارش</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
